# kubeadm containerd registry mirrors — registry-1.docker.io
# Some images reference registry-1.docker.io explicitly (e.g. bitnami/redis)
# Copy to: /etc/containerd/certs.d/registry-1.docker.io/hosts.toml
# Restart containerd: sudo systemctl restart containerd
server = "https://registry-1.docker.io"

[host."https://docker.m.daocloud.io"]
  capabilities = ["pull", "resolve"]
[host."https://docker.1ms.run"]
  capabilities = ["pull", "resolve"]
[host."https://docker.xuanyuan.me"]
  capabilities = ["pull", "resolve"]
[host."https://hub.rat.dev"]
  capabilities = ["pull", "resolve"]
