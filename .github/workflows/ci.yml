name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: ShellCheck all scripts
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Run smoke tests
        run: bash tests/smoke_test.sh
